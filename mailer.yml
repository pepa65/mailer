## Must have `user:` and `password:`
user: 
password: thelongandsafepassword
#server: smtp.google.com
## If port is 465, SSL/TLS is automatic
#port: 587
#tls: yes
## If `user:` is not an email, definitely fill in an email at `from:`
#from:
#cc: 
#bcc: 
#reply: 
#unsubscribe: 
## Must have `email:`, `to:` and `subject:`
email: from@the.me
to: must@send.to
## Best surround it with quotes, as characters like colons or hashes could cause problems
subject: 'Test subject'
## Only 1 attachment can be specified in the configfile, but multiple on the commandline
attachment: go.sum
## Either `messagefile:`/`formattedfile:` or `message:`/`formatted:` should be given
#messagefile: mailfile
## All non-empty lines in `message: |+` (or `formatted: |+`) must start with at least 1 space
message: |+
 Hello there,

 This is an example message. Long lines should be fine.
 Including a colon: should be okay after "|+"..!

 Newlines stay end-of-lines.
 Grtz,

 The mailer

